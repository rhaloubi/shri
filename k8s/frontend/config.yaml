apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  # Point to API Gateway service (not localhost)
  NEXT_PUBLIC_API_URL: "http://localhost"
  NEXT_PUBLIC_APP_NAME: "Microservices App"

  # BetterAuth should point to frontend service itself
  BETTER_AUTH_URL: "http://localhost"
  NEXT_PUBLIC_BETTER_AUTH_URL: "http://localhost"

  NODE_ENV: "production"
  PORT: "3000"

  # Next.js specific
  NEXT_TELEMETRY_DISABLED: "1"
