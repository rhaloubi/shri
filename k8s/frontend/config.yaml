apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  # Empty string = relative URLs (easiest solution!)
  NEXT_PUBLIC_API_URL: ""

  NEXT_PUBLIC_APP_NAME: "Microservices App"
  BETTER_AUTH_URL: "http://localhost"

  NODE_ENV: "production"
  PORT: "3000"

  NEXT_TELEMETRY_DISABLED: "1"
